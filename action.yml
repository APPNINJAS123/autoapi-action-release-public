          docker run --rm --network none --user 0:0 --mount "type=volume,src=${PYTHON_PUBLIC_ARCHIVE_CACHE_VOLUME},dst=/public-archives" "${analysis_image}" chmod 0777 /public-archives
          python_public_archive_mount=(--mount "type=volume,src=${PYTHON_PUBLIC_ARCHIVE_CACHE_VOLUME},dst=/opt/python-public-archives")
