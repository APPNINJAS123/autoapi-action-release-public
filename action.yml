          sh -c 'set -eu; export PATH="/workspace/.venv/bin:/opt/dependency-cache/coursier/bin:/opt/dependency-cache/go-tools:/opt/dependency-cache/uv-tool/bin:/opt/automated-api/node_modules/.bin:$PATH"; /bin/mkdir -p "$HOME"; if [ -f /opt/python-certified-cache/python-certified.json ]; then export AUTOMATED_API_PYTHON_CERTIFIED_CACHE=/opt/python-certified-cache; fi;
          if [ "$MANAGER_VARIANT" = dart-pub ]; then
            dart_version_output="$(PATH=/usr/lib/dart/bin:/usr/local/bin:/usr/bin:/bin DART_SUPPRESS_ANALYTICS=true /usr/lib/dart/bin/dart --version 2>&1)";
            case "$dart_version_output" in "Dart SDK version: $MANAGER_VERSION "*) ;; *) exit 2;; esac;
            dart_manager_root="$(/usr/bin/realpath -e "/workspace/$MANAGER_DIRECTORY")";
            case "$dart_manager_root" in /workspace|/workspace/*) ;; *) exit 2;; esac;
            (cd "$dart_manager_root" && PATH=/usr/lib/dart/bin:/usr/local/bin:/usr/bin:/bin DART_SUPPRESS_ANALYTICS=true /usr/lib/dart/bin/dart pub get --offline);
          fi;
          if [ -f /input/harness-result.json ]; then exec /usr/local/bin/node /opt/automated-api/packages/runner/dist/cli.js /input/job.json /workspace /output /input/harness-result.json; else exec /usr/local/bin/node /opt/automated-api/packages/runner/dist/cli.js /input/job.json /workspace /output; fi'
        final_runner_completed=1

