            --mount "type=bind,src=${dependency_cache}/python-built-wheels,dst=/out" \
            "${runner_image}" python -I /tool/python-certified-environment.py build /input /out
          python_builder_container=""
        fi

        # Certify the exact manager/runtime against a fresh exact clone of HEAD with
        # networking disabled. Package managers may create or rewrite build
        # metadata even during frozen/offline commands, so certification gets
        # a disposable writable tree and never the real customer checkout.
        # This produces the only authority the proposal runner and control
        # plane accept for toolchain use.
        test ! -e "${OUTPUT_DIRECTORY}/toolchain-certification.json"
        test ! -L "${OUTPUT_DIRECTORY}/toolchain-certification.json"
        docker run --rm --network none --user 0:0 \
          --mount "type=bind,src=${certification_source},dst=/workspace" \
          --mount "type=bind,src=${dependency_cache},dst=/opt/dependency-cache" \
          --mount "type=bind,src=${python_certified_cache},dst=/opt/python-certified-cache" \
          --mount "type=bind,src=${OUTPUT_DIRECTORY},dst=/output" \
          --env "CERTIFICATION_RUNTIME_UID=${certification_runtime_uid}" \
          --env "CERTIFICATION_RUNTIME_GID=${certification_runtime_gid}" \
          "${runner_image}" sh -c 'chown -R "$CERTIFICATION_RUNTIME_UID:$CERTIFICATION_RUNTIME_GID" /workspace /opt/dependency-cache /opt/python-certified-cache; chown "$CERTIFICATION_RUNTIME_UID:$CERTIFICATION_RUNTIME_GID" /output'
        certification_manager_container="autoapi-cert-manager-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
        docker run --rm --name "${certification_manager_container}" --network none \
          --user "${certification_runtime_uid}:${certification_runtime_gid}" \
          --read-only --cap-drop ALL --security-opt no-new-privileges \
          --memory 2g --cpus 2 --pids-limit 256 \
          --tmpfs /tmp:rw,exec,nosuid,nodev,size=536870912 \
          ${maven_wrapper_cache_environment[@]+"${maven_wrapper_cache_environment[@]}"} \
          --mount "type=bind,src=${runner_source},dst=/opt/automated-api,readonly" \
          --mount "type=bind,src=${dependency_cache},dst=/opt/dependency-cache" \
          --mount "type=bind,src=${python_certified_cache},dst=/opt/python-certified-cache" \
          --mount "type=bind,src=${dependency_source},dst=/opt/dependency-source,readonly" \
          --mount "type=bind,src=${resolution_source},dst=/opt/dependency-resolution,readonly" \
          --mount "type=bind,src=${certification_source},dst=/workspace" \
          --mount "type=bind,src=${JOB_PATH},dst=/input/job.json,readonly" \
          --workdir "${manager_workdir}" \
          --env "HOME=/opt/dependency-cache/home" \
          --env "COREPACK_HOME=/opt/dependency-cache/corepack" \
          --env "COREPACK_ENABLE_NETWORK=0" \
          --env "npm_config_cache=/opt/dependency-cache/npm" \
          --env "pnpm_config_store_dir=/opt/dependency-cache/pnpm" \
          --env "npm_config_ignore_pnpmfile=true" \
          --env "XDG_CACHE_HOME=/opt/dependency-cache/xdg-cache" \
          --env "YARN_CACHE_FOLDER=/opt/dependency-cache/yarn-classic" \
          --env "YARN_ENABLE_NETWORK=0" \
          --env "YARN_ENABLE_GLOBAL_CACHE=true" \
          --env "YARN_GLOBAL_FOLDER=/opt/dependency-cache/yarn-berry" \
          --env "YARN_ENABLE_SCRIPTS=false" \
          --env "YARN_IGNORE_PATH=1" \
          --env "YARN_ENABLE_CONSTRAINTS_CHECKS=false" \
          --env "UV_CACHE_DIR=/opt/dependency-cache/uv" \
          --env "CARGO_HOME=/opt/dependency-cache/cargo" \
          --env "CARGO_TARGET_DIR=/opt/dependency-cache/cargo-target" \
          --env "CARGO_NET_OFFLINE=true" \
          --env "RUSTUP_TOOLCHAIN=${rust_version}-x86_64-unknown-linux-gnu" \
          --env "GOPATH=/opt/dependency-cache/go" \
          --env "GOMODCACHE=/opt/dependency-cache/go/pkg/mod" \
          --env "GOCACHE=/opt/dependency-cache/go-build" \
          --env "GOPROXY=off" \
          --env "MAVEN_USER_HOME=/opt/dependency-cache/m2" \
          --env "MAVEN_OPTS=-Dmaven.repo.local=/opt/dependency-cache/m2/repository" \
          --env "COURSIER_CACHE=/opt/dependency-cache/coursier/cache" \
          --env "COURSIER_ARCHIVE_CACHE=/opt/dependency-cache/coursier/archive" \
          --env "COURSIER_JVM_CACHE=/opt/dependency-cache/coursier/jvm" \
          --env "COURSIER_CONFIG_DIR=/opt/dependency-cache/coursier/config" \
          --env "COURSIER_DATA_DIR=/opt/dependency-cache/coursier/data" \
          --env "JAVA_TOOL_OPTIONS=-Duser.home=/opt/dependency-cache/home -Dsbt.global.base=/opt/dependency-cache/sbt/global -Dsbt.boot.directory=/opt/dependency-cache/sbt/boot -Dsbt.ivy.home=/opt/dependency-cache/sbt/ivy -Dsbt.coursier.home=/opt/dependency-cache/coursier/cache -Dsbt.server.autostart=false -Dsbt.supershell=false -Dsbt.color=false -Dsbt.log.noformat=true" \
          --env "SBT_OPTS=-Duser.home=/opt/dependency-cache/home -Dsbt.global.base=/opt/dependency-cache/sbt/global -Dsbt.boot.directory=/opt/dependency-cache/sbt/boot -Dsbt.ivy.home=/opt/dependency-cache/sbt/ivy -Dsbt.coursier.home=/opt/dependency-cache/coursier/cache -Dsbt.server.autostart=false -Dsbt.supershell=false -Dsbt.color=false -Dsbt.log.noformat=true" \
          --env "GRADLE_USER_HOME=/opt/dependency-cache/gradle" \
          --env "GRADLE_OPTS=-Dorg.gradle.workers.max=2 -Dorg.gradle.daemon=false" \
          --env "AUTOAPI_GRADLE_PREFETCH_PROJECTS=${gradle_prefetch_projects}" \
          --env "AUTOAPI_GRADLE_PREFETCH_TASKS=${gradle_prefetch_tasks}" \
          --env "NUGET_PACKAGES=/opt/dependency-cache/nuget" \
          --env "COMPOSER_HOME=/opt/dependency-cache/composer-home" \
          --env "COMPOSER_CACHE_DIR=/opt/dependency-cache/composer-cache" \
          --env "COMPOSER_ROOT_VERSION=${composer_root_version}" \
          --env "SYMFONY_PHPUNIT_DIR=/opt/dependency-cache/symfony-phpunit" \
          --env "BUNDLE_PATH=/opt/dependency-cache/bundle" \
          --env "PUB_CACHE=/opt/dependency-cache/pub" \
          --env "MIX_HOME=/opt/dependency-cache/mix" \
          --env "HEX_HOME=/opt/dependency-cache/hex" \
          --env "MIX_ENV=test" \
          --env "HEX_OFFLINE=1" \
          --env "CLJ_CONFIG=/opt/dependency-cache/clojure" \
          --env "LEIN_HOME=/opt/dependency-cache/lein" \
          --env "VCPKG_DISABLE_METRICS=1" \
          --env "LEIN_JVM_OPTS=-Duser.home=/opt/dependency-cache/home" \
          --env "PIP_CACHE_DIR=/opt/dependency-cache/pip" \
          --env "MANAGER_NAME=${manager_name}" \
          --env "MANAGER_VERSION=${manager_version}" \
          --env "MANAGER_VARIANT=${manager_variant}" \
          --env "MANAGER_SPEC=${manager_spec}" \
          --env "MANAGER_LOCKFILE=${manager_lockfile}" \
          --env "PYTHON_VERSION=${python_version}" \
          --env "RUNTIME_VERSION=${runtime_version}" \
          --env "ERLANG_VERSION=${erlang_version}" \
          --env "SCALA_VERSION=${scala_version}" \
          --env "COURSIER_VERSION=${coursier_version}" \
          --env "HEX_VERSION=${hex_version}" \
          --env "HEX_ARCHIVE_URL=${hex_archive_url}" \
          --env "HEX_ARCHIVE_SHA512=${hex_archive_sha512}" \
          --env "REBAR3_VERSION=${rebar3_version}" \
          --env "REBAR3_ARCHIVE_URL=${rebar3_archive_url}" \
          --env "REBAR3_ARCHIVE_SHA512=${rebar3_archive_sha512}" \
          --env "AUTOMATED_API_ELIXIR_TOOL_PROOF=/opt/dependency-cache/elixir-tools/verified-tools" \
          --env "AUTOMATED_API_RESOLVED_PYTHON_VERSION=${python_version}" \
          --env "LOCKFILE_BEFORE_SHA256=${lockfile_before_sha256}" \
          --env "RUNNER_IMAGE_ID=${runner_image_id}" \
          --env "RUNTIME_IMAGES_JSON=${runtime_images_json}" \
          --env "CERTIFICATION_HEAD=${certification_head}" \
          --env "CERTIFICATION_TREE=${certification_tree}" \
          --env "REPOSITORY_LANGUAGE=$(node -e 'const j=require(process.argv[1]);process.stdout.write(j.changeEvent.affectedLanguages.length===1?j.changeEvent.affectedLanguages[0]:"")' "${JOB_PATH}")" \
          --env "AUTOMATED_API_PYTHON=/usr/local/bin/python" \
          --env "AUTOMATED_API_VCPKG=/opt/dependency-cache/vcpkg/vcpkg" \
          --env "AUTOMATED_API_CC=cc" \
          --env "AUTOMATED_API_VCPKG_COMMIT_FILE=/opt/dependency-cache/vcpkg/.autoapi-vcpkg-commit" \
          --env "AUTOMATED_API_VCPKG_RESOLVED_MANIFEST=/opt/dependency-resolution/${manager_directory}/vcpkg.json" \
          --env "AUTOMATED_API_VCPKG_PROJECTION_MANIFEST=/opt/dependency-source/vcpkg.json" \
          "${runner_image}" \
          sh -c 'set -eu; export PATH="/opt/dependency-cache/coursier/bin:/opt/dependency-cache/uv-tool/bin:/opt/automated-api/node_modules/.bin:$PATH"; mkdir -p "$HOME";
          case "$MANAGER_VARIANT" in
            analysis-only) [ "$MANAGER_NAME" = none ] ;;
            npm)
              npm_cli=/opt/dependency-cache/npm-manager/node_modules/npm/bin/npm-cli.js;
              [ "$(node "$npm_cli" --version)" = "$MANAGER_VERSION" ];
              node "$npm_cli" ci --offline --ignore-scripts --no-audit --no-fund ;;
            pnpm)
              [ "$(corepack pnpm --version)" = "$MANAGER_VERSION" ];
              corepack pnpm install --prefer-offline --prod=false --frozen-lockfile --ignore-scripts --store-dir /opt/dependency-cache/pnpm ;;
            yarn-classic)
              [ "$(corepack yarn --version)" = "$MANAGER_VERSION" ];
              corepack yarn install --offline --frozen-lockfile --production=false --ignore-scripts --cache-folder /opt/dependency-cache/yarn-classic ;;
            yarn-berry)
              [ "$(corepack yarn --version)" = "$MANAGER_VERSION" ];
              corepack yarn install --immutable --mode=skip-build ;;
            python-pip)
              [ "$(python --version 2>&1)" = "Python $PYTHON_VERSION" ];
              rm -rf /opt/dependency-cache/python-certification;
              python -m pip install --require-hashes --no-index --find-links /opt/dependency-cache/python-wheels --only-binary=:all: --target /opt/dependency-cache/python-certification --requirement "$MANAGER_LOCKFILE" ;;
            python-uv)
              [ "$(python --version 2>&1)" = "Python $PYTHON_VERSION" ];
              [ "$(uv --version | awk "{print \$2}")" = "$MANAGER_VERSION" ];
              if [ -f /opt/dependency-cache/python-build-inputs/selection.json ]; then
                python -I /opt/automated-api/scripts/lib/python-certified-environment.py certify \
                  "$PWD" /opt/dependency-cache /input/job.json uv /opt/python-certified-cache;
              else
                uv sync --offline --frozen --no-install-workspace --no-build --python "$PYTHON_VERSION";
              fi ;;
            python-stdlib) [ "$(python --version 2>&1)" = "Python $PYTHON_VERSION" ] ;;
            rust-cargo)
              [ "$(cargo --version | awk "{print \$2}")" = "$MANAGER_VERSION" ];
              cargo metadata --offline --frozen --format-version 1 --no-deps > /dev/null ;;
            go-modules)
              [ "$(go version | awk "{print \$3}")" = "go$MANAGER_VERSION" ];
              go mod verify ;;
            jvm-maven)
              maven_root="$PWD";
              while [ ! -x "$maven_root/mvnw" ] && [ "$maven_root" != /workspace ]; do maven_root="$(dirname "$maven_root")"; done;
              maven_wrapper="$maven_root/mvnw";
              [ -x "$maven_wrapper" ];
              [ "$("$maven_wrapper" --version | grep -oE "[0-9]+([.][0-9]+)+" | head -1)" = "$MANAGER_VERSION" ];
              "$maven_wrapper" -o -B -DskipTests dependency:go-offline ;;
            jvm-gradle)
              gradle_root="$(pwd -P)";
              case "$gradle_root" in /workspace|/workspace/*) ;; *) exit 1;; esac;
              while [ ! -x "$gradle_root/gradlew" ] && [ "$gradle_root" != /workspace ]; do gradle_root="$(dirname "$gradle_root")"; done;
              gradle_wrapper="$gradle_root/gradlew";
              [ -x "$gradle_wrapper" ];
              [ ! -L "$gradle_wrapper" ];
              [ "$("$gradle_wrapper" --version | sed -n "s/^Gradle //p" | head -1)" = "$MANAGER_VERSION" ];
              if [ "$AUTOAPI_GRADLE_PREFETCH_TASKS" = \* ]; then
                "$gradle_wrapper" --offline --no-daemon --no-parallel "-Pkotlin.compiler.execution.strategy=in-process" --init-script /opt/autoapi-runtime/gradle-dependency-prefetch.init.gradle autoApiPrefetchDependencies;
              else
                env AUTOAPI_GRADLE_PREFETCH_TASK_GRAPH=1 "$gradle_wrapper" --offline --no-daemon --no-parallel "-Pkotlin.compiler.execution.strategy=in-process" --init-script /opt/autoapi-runtime/gradle-dependency-prefetch.init.gradle --dry-run autoApiPrefetchValidationDependencies;
              fi ;;
            scala-sbt)
              export PATH="/opt/dependency-cache/coursier/bin:$PATH";
              [ "$(cs version)" = "$COURSIER_VERSION" ];
              sbt_version_output="$(cs launch --mode offline "sbt:${MANAGER_VERSION}" -- "show sbtVersion")";
              [ "$(printf "%s\n" "$sbt_version_output" | grep -E "^\[info\] [0-9]+([.][0-9]+)+$" | cut -d " " -f2 | sort -u)" = "$MANAGER_VERSION" ];
              cs launch --mode offline "sbt:${MANAGER_VERSION}" -- update ;;
            dotnet-nuget)
              [ "$(dotnet --version)" = "$MANAGER_VERSION" ]; dotnet restore --locked-mode --ignore-failed-sources --packages "$NUGET_PACKAGES" -p:EnableWindowsTargeting=true ;;
            php-composer)
              [ "$(composer --version --no-ansi | awk "{print \$3}")" = "$MANAGER_VERSION" ];
              composer install --dry-run --no-interaction --no-plugins --no-scripts ;;
            ruby-bundler)
              [ "$(bundle "_${MANAGER_VERSION}_" --version | awk "{print \$3}")" = "$MANAGER_VERSION" ]; bundle "_${MANAGER_VERSION}_" check ;;
            swift-package)
              swift_actual="$(swift --version | grep -oE "[0-9]+([.][0-9]+)+" | head -1)";
              case "$MANAGER_VERSION" in "$swift_actual"|"$swift_actual.0") ;; *) exit 1 ;; esac;
              swift package --only-use-versions-from-resolved-file show-dependencies > /dev/null ;;
            dart-pub)
              [ "$(dart --version 2>&1 | grep -oE "[0-9]+([.][0-9]+)+" | head -1)" = "$MANAGER_VERSION" ]; dart pub get --offline ;;
            elixir-mix)
              [ "$(elixir --version | grep "^Elixir " | cut -d " " -f2)" = "$RUNTIME_VERSION" ];
              [ "$(mix --version | grep "^Mix " | cut -d " " -f2)" = "$MANAGER_VERSION" ];
              printf "%s  %s\n" "$HEX_ARCHIVE_SHA512" /opt/dependency-cache/elixir-tools/hex.ez | sha512sum --check --status;
              printf "%s  %s\n" "$REBAR3_ARCHIVE_SHA512" /opt/dependency-cache/elixir-tools/rebar3 | sha512sum --check --status;
              hex_info="$(mix hex.info)" || { printf "%s\n" "Hex version command failed" >&2; exit 1; };
              hex_actual="$(printf "%s\n" "$hex_info" | sed -n "s/^Hex:[[:space:]]*//p" | head -1)";
              [ "$hex_actual" = "$HEX_VERSION" ] || { printf "Hex version mismatch: expected %s, found %s\n" "$HEX_VERSION" "${hex_actual:-<missing>}" >&2; exit 1; };
              elixir_minor="$(printf "%s" "$RUNTIME_VERSION" | cut -d. -f1-2 | tr . -)"; otp_major="${ERLANG_VERSION%%.*}";
              local_rebar3="$MIX_HOME/elixir/${elixir_minor}-otp-${otp_major}/rebar3";
              [ "$("$local_rebar3" version | grep -oE "[0-9]+([.][0-9]+){2}" | head -1)" = "$REBAR3_VERSION" ];
              printf "%s\n%s\n%s\n%s\n%s\n%s\n" "$HEX_VERSION" "$HEX_ARCHIVE_URL" "$HEX_ARCHIVE_SHA512" "$REBAR3_VERSION" "$REBAR3_ARCHIVE_URL" "$REBAR3_ARCHIVE_SHA512" > /opt/dependency-cache/elixir-tools/verified-tools.part;
              mv /opt/dependency-cache/elixir-tools/verified-tools.part /opt/dependency-cache/elixir-tools/verified-tools;
              mix deps.get --only test ;;
            clojure-tools-deps)
              [ "$(clojure -Sdescribe | grep -oE "[0-9]+([.][0-9]+)+" | head -1)" = "$MANAGER_VERSION" ];
              [ "$(clojure -Srepro -M -e "(print (clojure-version))")" = "$RUNTIME_VERSION" ];
              clojure -Soffline -P ;;
            clojure-leiningen)
              [ "$(lein version | grep -oE "[0-9]+([.][0-9]+)+" | head -1)" = "$MANAGER_VERSION" ];
              [ "$(lein -o update-in :prep-tasks empty -- trampoline run -m clojure.main -e "(print (clojure-version))" | grep -E "^[0-9]+([.][0-9]+)+$" | tail -1)" = "$RUNTIME_VERSION" ];
              lein -o deps ;;
            c-vcpkg|cpp-vcpkg)
              [ "$MANAGER_NAME" = vcpkg ];
              [ "$(cat /opt/dependency-cache/vcpkg/.autoapi-vcpkg-commit)" = "$MANAGER_VERSION" ];
              /opt/dependency-cache/vcpkg/vcpkg install --x-manifest-root=/opt/dependency-source --dry-run \
                --x-install-root=/opt/dependency-cache/vcpkg-prefetch-installed \
                --downloads-root=/opt/dependency-cache/vcpkg-downloads \
                --x-buildtrees-root=/opt/dependency-cache/vcpkg-buildtrees \
                --binarysource=clear\;files,/opt/dependency-cache/vcpkg-binary,read ;;
            *) exit 2 ;;
          esac'
        certification_manager_container=""

        # The customer package-manager process is gone before trusted
        # verification begins. The fresh container cannot mutate the exact
        # source, Action runtime, dependency cache, or its own root filesystem.
        # Manager commands were already checked above, so certificate creation
        # never re-executes a repository-owned wrapper or project task.
        certification_verifier_container="autoapi-cert-verifier-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
        docker run --rm --name "${certification_verifier_container}" --network none \
          --user "${certification_runtime_uid}:${certification_runtime_gid}" \
          --read-only --cap-drop ALL --security-opt no-new-privileges \
          --memory 1g --cpus 1 --pids-limit 128 \
          --tmpfs /tmp:rw,exec,nosuid,nodev,size=67108864 \
          --mount "type=bind,src=${runner_source},dst=/opt/automated-api,readonly" \
          --mount "type=bind,src=${dependency_cache},dst=/opt/dependency-cache,readonly" \
          --mount "type=bind,src=${python_certified_cache},dst=/opt/python-certified-cache,readonly" \
          --mount "type=bind,src=${dependency_source},dst=/opt/dependency-source,readonly" \
          --mount "type=bind,src=${resolution_source},dst=/opt/dependency-resolution,readonly" \
          --mount "type=bind,src=${certification_source},dst=/workspace,readonly" \
          --mount "type=bind,src=${JOB_PATH},dst=/input/job.json,readonly" \
          --mount "type=bind,src=${OUTPUT_DIRECTORY},dst=/output" \
          --workdir "${manager_workdir}" \
          --env "HOME=/tmp/automated-api-home" \
          --env "PATH=/opt/java/openjdk/bin:/usr/local/cargo/bin:/usr/local/go/bin:/usr/local/swift/usr/bin:/usr/lib/dart/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" \
          --env "MANAGER_NAME=${manager_name}" \
          --env "MANAGER_VERSION=${manager_version}" \
          --env "MANAGER_VARIANT=${manager_variant}" \
          --env "MANAGER_SPEC=${manager_spec}" \
          --env "MANAGER_LOCKFILE=${manager_lockfile}" \
          --env "PYTHON_VERSION=${python_version}" \
          --env "RUNTIME_VERSION=${runtime_version}" \
          --env "ERLANG_VERSION=${erlang_version}" \
          --env "SCALA_VERSION=${scala_version}" \
          --env "COURSIER_VERSION=${coursier_version}" \
          --env "HEX_VERSION=${hex_version}" \
          --env "HEX_ARCHIVE_URL=${hex_archive_url}" \
          --env "HEX_ARCHIVE_SHA512=${hex_archive_sha512}" \
          --env "REBAR3_VERSION=${rebar3_version}" \
          --env "REBAR3_ARCHIVE_URL=${rebar3_archive_url}" \
          --env "REBAR3_ARCHIVE_SHA512=${rebar3_archive_sha512}" \
          --env "MIX_HOME=/opt/dependency-cache/mix" \
          --env "RUNNER_IMAGE_ID=${runner_image_id}" \
          --env "RUNTIME_IMAGES_JSON=${runtime_images_json}" \
          --env "LOCKFILE_BEFORE_SHA256=${lockfile_before_sha256}" \
          --env "CERTIFICATION_HEAD=${certification_head}" \
          --env "CERTIFICATION_TREE=${certification_tree}" \
          --env "REPOSITORY_LANGUAGE=$(node -e 'const j=require(process.argv[1]);process.stdout.write(j.changeEvent.affectedLanguages.length===1?j.changeEvent.affectedLanguages[0]:"")' "${JOB_PATH}")" \
          --env "AUTOMATED_API_MANAGER_EXECUTION_VERIFIED=1" \
          --env "AUTOMATED_API_PYTHON=/usr/local/bin/python" \
          --env "AUTOMATED_API_ELIXIR_TOOL_PROOF=/opt/dependency-cache/elixir-tools/verified-tools" \
          --env "AUTOMATED_API_VCPKG=/opt/dependency-cache/vcpkg/vcpkg" \
          --env "AUTOMATED_API_CC=cc" \
          --env "AUTOMATED_API_VCPKG_COMMIT_FILE=/opt/dependency-cache/vcpkg/.autoapi-vcpkg-commit" \
          --env "AUTOMATED_API_VCPKG_RESOLVED_MANIFEST=/opt/dependency-resolution/${manager_directory}/vcpkg.json" \
          --env "AUTOMATED_API_VCPKG_PROJECTION_MANIFEST=/opt/dependency-source/vcpkg.json" \
          "${runner_image}" \
          sh -c 'set -eu;
          mkdir -p "$HOME";
          # CERTIFICATION_SOURCE_POST_OFFLINE_INTEGRITY_BEGIN
          trusted_git=/usr/bin/git;
          [ -x "$trusted_git" ];
          git_environment="GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_SYSTEM=/dev/null GIT_NO_REPLACE_OBJECTS=1 GIT_DIR=/workspace/.git GIT_WORK_TREE=/workspace";
          [ "$(env $git_environment "$trusted_git" rev-parse HEAD)" = "$CERTIFICATION_HEAD" ];
          [ "$(env $git_environment "$trusted_git" rev-parse HEAD^{tree})" = "$CERTIFICATION_TREE" ];
          /usr/local/bin/node /opt/automated-api/scripts/lib/verify-exact-worktree.mjs verify \
            /workspace "$CERTIFICATION_TREE" /opt/automated-api/.autoapi-certification-source.json;
          # CERTIFICATION_SOURCE_POST_OFFLINE_INTEGRITY_END
          if [ -f /opt/python-certified-cache/python-certified.json ]; then export AUTOMATED_API_PYTHON_CERTIFIED_RECEIPT=/opt/python-certified-cache/python-certified.json; fi;
          exec /usr/local/bin/node /opt/automated-api/packages/runner/dist/toolchainCertificationCli.js \
            /input/job.json /workspace /output/toolchain-certification.json'
        certification_verifier_container=""

        # A deferred Dart pass has no early result. On normal re-entry, consume
        # its supplied Harness result only after the same offline certification.
        if [ "${analysis_result_status}" = harness_required ] || { [ "${dart_analysis_deferred}" = 1 ] && [ -n "${harness_result_path}" ]; }; then
          if [ -n "${harness_wait_pid}" ]; then
            if ! wait "${harness_wait_pid}"; then
              harness_wait_pid=""
              [ ! -s "${harness_wait_error}" ] || cat "${harness_wait_error}" >&2
              exit 1
            fi
            harness_wait_pid=""
          else
            wait_for_harness_result
          fi
          test -s "${harness_result_path}"
          harness_mount+=(--mount "type=bind,src=${harness_result_path},dst=/input/harness-result.json,readonly")
        fi

        # The first analysis invocation committed a trusted preliminary result.
        # Remove only that owned regular file so the final invocation can use
        # create-only publication and detect any validation-command collision.
        if [ -n "${analysis_result_status}" ]; then
          remove_preliminary_runner_result
        fi

        # CUSTOMER_SOURCE_RAW_INTEGRITY_VERIFY_BEGIN
        # Git's clean filters, info attributes, EOL conversion and index flags
        # can all make changed bytes appear clean. Re-read the complete raw
        # workspace (excluding only .git) immediately before the intentional
        # final proposal mutation phase.
        docker run --rm --network none --user "$(id -u):$(id -g)" \
          --read-only --cap-drop ALL --security-opt no-new-privileges \
          --mount "type=bind,src=${GITHUB_WORKSPACE},dst=/workspace,readonly" \
          --mount "type=bind,src=${runner_source},dst=/opt/automated-api,readonly" \
          "${analysis_image}" /usr/local/bin/node \
            /opt/automated-api/scripts/lib/verify-exact-worktree.mjs verify \
            /workspace "${customer_source_tree}" "${customer_source_manifest}"
        # CUSTOMER_SOURCE_RAW_INTEGRITY_VERIFY_END

        docker run --rm --network none --user "$(id -u):$(id -g)" \
          ${maven_wrapper_cache_environment[@]+"${maven_wrapper_cache_environment[@]}"} \
          --mount "type=bind,src=${runner_source},dst=/opt/automated-api,readonly" \
