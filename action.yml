            IFS=$'\x1f' read -r manager_name manager_version manager_variant manager_lockfile manager_spec manager_directory manager_manifest python_version runtime_version scala_version coursier_version erlang_version hex_version hex_archive_url hex_archive_sha512 rebar3_version rebar3_archive_url rebar3_archive_sha512 gradle_prefetch_projects gradle_prefetch_tasks \
              < <(docker run --rm --network none --user "$(id -u):$(id -g)" \
