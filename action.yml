name: Automated API proposal runner
description: Certify the repository's exact toolchain, then run the pinned proposal engine without network access
inputs:
  job-path:
    description: Absolute path to the fetched migration job
    required: true
  job-sha256:
    description: Expected SHA-256 of the migration job
    required: true
  output-directory:
    description: Absolute directory for the proposal result
    required: true
  harness-result-path:
    description: Optional path where a control-plane-issued Harness result exists or will be written
    required: false
    default: ''
  control-plane-url:
    description: Optional HTTPS control plane used to queue Harness while dependency preparation runs
    required: false
    default: ''
  job-token:
    description: Optional opaque job token paired with control-plane-url
    required: false
    default: ''
  python-public-archive-cache-volume:
    description: Optional dedicated autoapi-python-public-* Docker volume for untrusted public archive bytes only
    required: false
    default: ''
outputs:
  output-directory:
    description: Proposal output directory
    value: ${{ steps.run.outputs.output_directory }}
runs:
  using: composite
  steps:
    - id: run
      name: Build trusted runner and execute offline
      shell: bash
      env:
        JOB_PATH: ${{ inputs.job-path }}
        JOB_SHA256: ${{ inputs.job-sha256 }}
        OUTPUT_DIRECTORY: ${{ inputs.output-directory }}
        HARNESS_RESULT_PATH: ${{ inputs.harness-result-path }}
        CONTROL_PLANE_URL: ${{ inputs.control-plane-url }}
        JOB_TOKEN: ${{ inputs.job-token }}
        PYTHON_PUBLIC_ARCHIVE_CACHE_VOLUME: ${{ inputs.python-public-archive-cache-volume }}
      run: |
        set -euo pipefail
        retry_network() {
          local attempt=1
          until "$@"; do
            if [ "${attempt}" -ge 5 ]; then return 1; fi
            sleep "$((attempt * 2))"
            attempt="$((attempt + 1))"
          done
        }
        test -f "${JOB_PATH}"
        echo "${JOB_SHA256}  ${JOB_PATH}" | sha256sum -c -
        job_deadline_seconds="$(node --input-type=module -e 'import fs from "node:fs"; const job=JSON.parse(fs.readFileSync(process.argv[1], "utf8")); const deadline=Date.parse(job.deadlineAt); if(!Number.isFinite(deadline)){console.error("Migration job is missing a valid serialized deadlineAt");process.exit(2)} const remaining=deadline-Date.now()-5000; if(remaining<=0){console.error("Migration job deadline leaves no terminal-result persistence reserve");process.exit(2)} const bounded=Math.max(1,Math.floor(remaining)); process.stdout.write(`${Math.floor(bounded/1000)}.${String(bounded%1000).padStart(3,"0")}`)' "${JOB_PATH}")"
        # The workflow's static 90-minute timeout is only a hard outer ceiling.
        # Re-execute the complete composite step under the job's persisted
        # remaining budget so image builds, dependency prefetch, the proposal,
        # validation, and every retry share one absolute deadline.
        case "$#" in
          0) exec timeout --signal=TERM --kill-after=120s "${job_deadline_seconds}s" bash "$0" --autoapi-internal-deadline-guard ;;
          1) [ "$1" = --autoapi-internal-deadline-guard ] || { echo "Invalid Action re-entry sentinel" >&2; exit 2; }; shift ;;
          *) echo "Unexpected Action arguments" >&2; exit 2 ;;
        esac
        mkdir -p "${OUTPUT_DIRECTORY}"
        harness_result_path="${HARNESS_RESULT_PATH}"
        harness_wait_pid=""
        final_runner_completed=0
        python_builder_container=""
        certification_manager_container=""
        certification_verifier_container=""
        harness_wait_error="${RUNNER_TEMP}/automated-api-harness-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.error"
        harness_mount=()
        cleanup_harness_waiter() {
          if [ -n "${harness_wait_pid}" ] && kill -0 "${harness_wait_pid}" 2>/dev/null; then
            kill "${harness_wait_pid}" 2>/dev/null || true
            wait "${harness_wait_pid}" 2>/dev/null || true
          fi
          harness_wait_pid=""
        }
        persist_terminal_action_failure() {
          local action_status="$1"
          if [ "${action_status}" = 0 ]; then return 0; fi
          ACTION_STATUS="${action_status}" TRUST_CURRENT_RESULT="${final_runner_completed}" OUTPUT_PATH="${OUTPUT_DIRECTORY}" QUARANTINE_PARENT="${RUNNER_TEMP}" RESULT_PATH="${OUTPUT_DIRECTORY}/result.json" PREPARATION_PATH="${OUTPUT_DIRECTORY}/preparation.json" node --input-type=module -e '
            import fs from "node:fs";
            import path from "node:path";
            const maximumJsonBytes=1024*1024;
            const terminal=new Set(["proposed","not_affected","blocked","manual","validation_failed","execution_failed"]);
            const readOwnedJson=(file)=>{
              let descriptor;
              try{
                descriptor=fs.openSync(file,fs.constants.O_RDONLY|fs.constants.O_NOFOLLOW|fs.constants.O_NONBLOCK);
                const metadata=fs.fstatSync(descriptor);
                if(!metadata.isFile()||metadata.nlink!==1||metadata.size>maximumJsonBytes)throw new Error("unsafe JSON input");
                return JSON.parse(fs.readFileSync(descriptor,"utf8"));
              }finally{if(descriptor!==undefined)fs.closeSync(descriptor)}
            };
            if(process.env.TRUST_CURRENT_RESULT==="1"){
              let current;
              try{current=readOwnedJson(process.env.RESULT_PATH)}catch{}
              if(terminal.has(current?.status))process.exit(0);
            }
            let stage="workflow";
            try{if(readOwnedJson(process.env.PREPARATION_PATH).status==="prepare_dependencies")stage="prepare_dependencies"}catch{}
            const status=Number(process.env.ACTION_STATUS);
            const rawRunId=process.env.GITHUB_RUN_ID??"";
            const result={status:"execution_failed",failureCode:"github_actions_step_failed",failureKind:"infrastructure",failureReason:[124,137,143].includes(status)?"timeout":"process_failure",stage,phase:"workflow",runId:/^\d+$/.test(rawRunId)?rawRunId:"0",runAttempt:Number(process.env.GITHUB_RUN_ATTEMPT??"1")};
            const outputMetadata=fs.lstatSync(process.env.OUTPUT_PATH);
            if(!outputMetadata.isDirectory()||outputMetadata.isSymbolicLink())throw new Error("unsafe output directory");
            let quarantineDirectory;
            for(const name of ["result.json","result.json.part","manifest.json","manifest.json.part","proposal.patch","proposal.patch.part"]){
              const candidate=path.join(process.env.OUTPUT_PATH,name);
              let metadata;
              try{metadata=fs.lstatSync(candidate)}catch(error){if(error?.code==="ENOENT")continue;throw error}
              if(metadata.isDirectory()&&!metadata.isSymbolicLink()){
                if(quarantineDirectory===undefined){
                  const parentMetadata=fs.lstatSync(process.env.QUARANTINE_PARENT);
                  if(!parentMetadata.isDirectory()||parentMetadata.isSymbolicLink())throw new Error("unsafe quarantine parent");
                  quarantineDirectory=fs.mkdtempSync(path.join(process.env.QUARANTINE_PARENT,"automated-api-output-quarantine-"));
                  fs.chmodSync(quarantineDirectory,0o700);
                }
                fs.renameSync(candidate,path.join(quarantineDirectory,name));
              }else fs.unlinkSync(candidate);
            }
            const stagingDirectory=fs.mkdtempSync(path.join(process.env.OUTPUT_PATH,".terminal-result-"));
            try{
              const staged=path.join(stagingDirectory,"result.json");
              const descriptor=fs.openSync(staged,"wx",0o600);
              try{fs.writeFileSync(descriptor,`${JSON.stringify(result,null,2)}\n`,"utf8");fs.fsyncSync(descriptor)}finally{fs.closeSync(descriptor)}
              fs.renameSync(staged,process.env.RESULT_PATH);
              const published=fs.lstatSync(process.env.RESULT_PATH);
              if(!published.isFile()||published.isSymbolicLink()||published.nlink!==1||(published.mode&0o777)!==0o600)throw new Error("unsafe terminal result publication");
            }finally{fs.rmSync(stagingDirectory,{recursive:true,force:true})}
          ' || true
        }
        remove_preliminary_runner_result() {
          EXPECTED_STATUS="${analysis_result_status}" RESULT_PATH="${OUTPUT_DIRECTORY}/result.json" node --input-type=module -e '
            import fs from "node:fs";
            let descriptor;
            try{
              descriptor=fs.openSync(process.env.RESULT_PATH,fs.constants.O_RDONLY|fs.constants.O_NOFOLLOW|fs.constants.O_NONBLOCK);
              const metadata=fs.fstatSync(descriptor);
              if(!metadata.isFile()||metadata.nlink!==1||metadata.size>1024*1024)throw new Error("unsafe preliminary result");
              const result=JSON.parse(fs.readFileSync(descriptor,"utf8"));
              if(result.status!==process.env.EXPECTED_STATUS)throw new Error("unexpected preliminary result");
            }finally{if(descriptor!==undefined)fs.closeSync(descriptor)}
            fs.unlinkSync(process.env.RESULT_PATH);
          '
        }
        cleanup_action() {
          local action_status="$?"
          trap - EXIT TERM INT
          persist_terminal_action_failure "${action_status}"
          cleanup_harness_waiter
          if [ -n "${python_builder_container}" ]; then docker rm -f "${python_builder_container}" >/dev/null 2>&1 || true; fi
          if [ -n "${certification_manager_container}" ]; then docker rm -f "${certification_manager_container}" >/dev/null 2>&1 || true; fi
          if [ -n "${certification_verifier_container}" ]; then docker rm -f "${certification_verifier_container}" >/dev/null 2>&1 || true; fi
          exit "${action_status}"
        }
        trap cleanup_action EXIT
        trap 'exit 143' TERM
        trap 'exit 130' INT
        job_deadline_at="$(node --input-type=module -e 'import fs from "node:fs"; const job=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); const deadline=Date.parse(job.deadlineAt); if(!Number.isFinite(deadline))process.exit(2); process.stdout.write(job.deadlineAt)' "${JOB_PATH}")"
        wait_for_harness_result() {
          while [ ! -s "${harness_result_path}" ]; do
            if [ -s "${harness_wait_error}" ]; then cat "${harness_wait_error}" >&2; return 1; fi
            node --input-type=module -e 'const deadline=Date.parse(process.argv[1]); if(!Number.isFinite(deadline)||Date.now()>=deadline)process.exit(1)' "${job_deadline_at}" || {
              printf '%s\n' 'Harness result was not persisted before the job deadline' > "${harness_wait_error}"
              cat "${harness_wait_error}" >&2
              return 1
            }
            sleep 2
          done
        }
        poll_harness_result() {
          local response="${harness_result_path}.part"
          rm -f "${response}" "${harness_wait_error}"
          while node --input-type=module -e 'const deadline=Date.parse(process.argv[1]); process.exit(Number.isFinite(deadline)&&Date.now()<deadline?0:1)' "${job_deadline_at}"; do
            local http_status=""
            if http_status="$(curl --silent --show-error --max-time 10 --output "${response}" --write-out '%{http_code}' --header "Authorization: Bearer ${JOB_TOKEN}" "${CONTROL_PLANE_URL%/}/internal/migration-jobs/${job_id}/harness-result")"; then
              case "${http_status}" in
                200) mv "${response}" "${harness_result_path}"; return 0 ;;
                202|429|502|503|504) ;;
                *) mv "${response}" "${harness_wait_error}"; return 1 ;;
              esac
            fi
            sleep 2
          done
          printf '%s\n' 'Harness result was not persisted before the job deadline' > "${harness_wait_error}"
          return 1
        }
        start_harness_concurrently() {
          if [ -n "${harness_result_path}" ]; then return 0; fi
          test -n "${CONTROL_PLANE_URL}" && test -n "${JOB_TOKEN}"
          case "${CONTROL_PLANE_URL}" in https://*) ;; *) echo "Control plane URL must use HTTPS" >&2; return 2;; esac
          job_id="$(node --input-type=module -e 'import fs from "node:fs"; const job=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); process.stdout.write(job.id)' "${JOB_PATH}")"
          local request="${RUNNER_TEMP}/automated-api-harness-request-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
          local queue_response="${RUNNER_TEMP}/automated-api-harness-queue-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
          RESULT="${OUTPUT_DIRECTORY}/result.json" REQUEST="${request}" node --input-type=module -e 'import fs from "node:fs"; const result=JSON.parse(fs.readFileSync(process.env.RESULT,"utf8")); if(result.status!=="harness_required")process.exit(2); fs.writeFileSync(process.env.REQUEST,JSON.stringify({result}))'
          curl --fail --silent --show-error --max-time 30 --request POST --header "Authorization: Bearer ${JOB_TOKEN}" --header "Content-Type: application/json" --data-binary "@${request}" "${CONTROL_PLANE_URL%/}/internal/migration-jobs/${job_id}/proposal" --output "${queue_response}"
          JOB_DEADLINE_AT="${job_deadline_at}" QUEUE_RESPONSE="${queue_response}" node --input-type=module -e 'import fs from "node:fs"; const value=JSON.parse(fs.readFileSync(process.env.QUEUE_RESPONSE,"utf8")); if(value.harnessDeadlineAt!==process.env.JOB_DEADLINE_AT){console.error("Harness queue changed the persisted job deadline");process.exit(2)}'
          harness_result_path="${RUNNER_TEMP}/automated-api-harness-result-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
          poll_harness_result &
          harness_wait_pid="$!"
        }

        runner_source="$(mktemp -d "${RUNNER_TEMP}/automated-api-runner-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-XXXXXX")"
        cp -R "${GITHUB_ACTION_PATH}/." "${runner_source}/"
        corepack enable
        retry_network corepack install --global pnpm@11.19.0
        # Run product tooling from the trusted Action root. Corepack otherwise
        # reads the customer checkout's packageManager and correctly refuses
        # to launch the Action's own pnpm when that customer uses npm or Yarn.
        (
          cd "${runner_source}"
          retry_network corepack pnpm install --frozen-lockfile --no-optional
          corepack pnpm build
        )

        analysis_image="automated-api-analysis:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
        analysis_runtime_ref="node:22-bookworm@sha256:673fce836d5a9185da33352682bfedb17c174d016370d08616748dff76fda862"
        retry_network docker build --pull --platform linux/amd64 \
          --target analysis_runtime \
          --file "${runner_source}/Dockerfile.runner" \
          --tag "${analysis_image}" "${runner_source}"
        analysis_image_id="$(docker image inspect --format '{{.Id}}' "${analysis_image}")"
        case "${analysis_image_id}" in sha256:????????????????????????????????????????????????????????????????) ;; *) echo "Invalid analysis image id" >&2; exit 2;; esac
        # CUSTOMER_SOURCE_RAW_INTEGRITY_CAPTURE_BEGIN
        # Snapshot the complete customer workspace as raw bytes, node kinds and
        # executable modes before any package-manager work. The verifier never
        # consults Git config, attributes or the index, and its manifest lives
        # under the trusted Action source rather than in the customer checkout.
        customer_source_manifest=/opt/automated-api/.autoapi-customer-source.json
        customer_source_tree="$(env -i PATH=/usr/bin:/bin GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_SYSTEM=/dev/null \
          GIT_NO_REPLACE_OBJECTS=1 /usr/bin/git -C "${GITHUB_WORKSPACE}" rev-parse HEAD^{tree})"
        docker run --rm --network none --user "$(id -u):$(id -g)" \
          --read-only --cap-drop ALL --security-opt no-new-privileges \
          --mount "type=bind,src=${GITHUB_WORKSPACE},dst=/workspace,readonly" \
          --mount "type=bind,src=${runner_source},dst=/opt/automated-api" \
          "${analysis_image}" /usr/local/bin/node \
            /opt/automated-api/scripts/lib/verify-exact-worktree.mjs capture \
            /workspace "${customer_source_tree}" "${customer_source_manifest}"
        # CUSTOMER_SOURCE_RAW_INTEGRITY_CAPTURE_END

        # Analyze first in the same network-disabled image used by the full
        # proposal. The repository is read-only and customer code is parsed,
        # never imported or executed. A conclusive no-op must not be turned
        # into a package-install failure by an unrelated dependency conflict.
        preparation_status="$(docker run --rm --network none --user "$(id -u):$(id -g)" \
          --mount "type=bind,src=${runner_source},dst=/opt/automated-api,readonly" \
          --mount "type=bind,src=${GITHUB_WORKSPACE},dst=/workspace,readonly" \
          --mount "type=bind,src=${JOB_PATH},dst=/input/job.json,readonly" \
          --mount "type=bind,src=${OUTPUT_DIRECTORY},dst=/output" \
          --workdir /workspace \
          --env "HOME=/tmp/automated-api-home" \
          --env "AUTOMATED_API_PYTHON=/usr/local/bin/python" \
          --env "PATH=/opt/automated-api/node_modules/.bin:/usr/local/bin:/usr/bin:/bin" \
          "${analysis_image}" \
          sh -c 'mkdir -p "$HOME"; exec node /opt/automated-api/packages/runner/dist/preparationCli.js /input/job.json /workspace /output')"
        case "${preparation_status}" in
          not_affected|blocked)
            test -f "${OUTPUT_DIRECTORY}/result.json"
            docker run --rm --network none --user "$(id -u):$(id -g)" \
              --mount "type=bind,src=${runner_source},dst=/opt/automated-api,readonly" \
              --mount "type=bind,src=${GITHUB_WORKSPACE},dst=/workspace,readonly" \
              --mount "type=bind,src=${JOB_PATH},dst=/input/job.json,readonly" \
              --mount "type=bind,src=${OUTPUT_DIRECTORY},dst=/output" \
              --workdir /workspace \
              --env "MANAGER_NAME=none" \
              --env "MANAGER_VERSION=1.0.0" \
              --env "MANAGER_SPEC=none@1.0.0" \
              --env "MANAGER_VARIANT=analysis-only" \
              --env "MANAGER_LOCKFILE=." \
              --env "RUNNER_IMAGE_ID=${analysis_image_id}" \
              --env "RUNTIME_IMAGES_JSON=[\"${analysis_runtime_ref}\"]" \
              --env "PATH=/opt/automated-api/node_modules/.bin:/usr/local/bin:/usr/bin:/bin" \
              "${analysis_image}" \
              node /opt/automated-api/packages/runner/dist/toolchainCertificationCli.js \
                /input/job.json /workspace /output/toolchain-certification.json
            echo "output_directory=${OUTPUT_DIRECTORY}" >> "${GITHUB_OUTPUT}"
            exit 0 ;;
          prepare_dependencies) ;;
          *) echo "Unsupported preparation result: ${preparation_status}" >&2; exit 2 ;;
        esac
        preparation_impact_outcome="$(OUTPUT="${OUTPUT_DIRECTORY}" node --input-type=module -e 'import fs from "node:fs"; import path from "node:path"; process.stdout.write(JSON.parse(fs.readFileSync(path.join(process.env.OUTPUT,"preparation.json"),"utf8")).impact.outcome)')"
        defer_preliminary_proposal="$(OUTPUT="${OUTPUT_DIRECTORY}" node --input-type=module -e 'import fs from "node:fs"; import path from "node:path"; process.stdout.write(JSON.parse(fs.readFileSync(path.join(process.env.OUTPUT,"preparation.json"),"utf8")).deferPreliminaryProposal === true ? "1" : "0")')"
        # Dart ownership needs its pinned SDK and certified original pub graph.
        # The generic analysis image has neither: let the final offline runtime
        # emit the first request, then use the normal Harness handoff/re-entry.
        dart_analysis_deferred="$(node -e 'const job=require(process.argv[1]);process.stdout.write((job.repository.packageManager?.startsWith("dart@") || job.changeEvent.affectedLanguages.includes("dart")) ? "1" : "0")' "${JOB_PATH}")"
        analysis_result_status=""
        if [ "${preparation_impact_outcome}" = affected_manual ] && [ "${dart_analysis_deferred}" != 1 ] && [ "${defer_preliminary_proposal}" != 1 ]; then
          docker run --rm --network none --user "$(id -u):$(id -g)" \
            --mount "type=bind,src=${runner_source},dst=/opt/automated-api,readonly" \
            --mount "type=bind,src=${GITHUB_WORKSPACE},dst=/workspace,readonly" \
            --mount "type=bind,src=${JOB_PATH},dst=/input/job.json,readonly" \
            --mount "type=bind,src=${OUTPUT_DIRECTORY},dst=/output" \
            --workdir /workspace \
            --env "HOME=/tmp/automated-api-home" \
            --env "AUTOMATED_API_PYTHON=/usr/local/bin/python" \
            --env "PATH=/opt/automated-api/node_modules/.bin:/usr/local/bin:/usr/bin:/bin" \
            "${analysis_image}" \
            sh -c 'mkdir -p "$HOME"; exec node /opt/automated-api/packages/runner/dist/cli.js /input/job.json /workspace /output'
          analysis_result_status="$(OUTPUT="${OUTPUT_DIRECTORY}" node --input-type=module -e 'import fs from "node:fs"; import path from "node:path"; process.stdout.write(JSON.parse(fs.readFileSync(path.join(process.env.OUTPUT,"result.json"),"utf8")).status)')"
          if [ "${analysis_result_status}" = harness_required ]; then start_harness_concurrently; fi
        fi

        # The networked stage performs only the customer's frozen/immutable
        # install in a disposable archive, with lifecycle scripts disabled.
        # Migration dependencies come from a separate clean, code-owned
        # manifest rather than provider text, model output, or arbitrary
        # customer input. A second disposable archive receives the reviewed
        # manifest edit so pnpm can cache every registry metadata record needed
        # by the future offline lockfile refresh. The real checkout is never
        # mounted into a network-enabled customer package-manager container.
        customer_source="$(mktemp -d "${RUNNER_TEMP}/automated-api-customer-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-XXXXXX")"
        certification_source="$(mktemp -d "${RUNNER_TEMP}/automated-api-certification-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-XXXXXX")"
        dependency_source="$(mktemp -d "${RUNNER_TEMP}/automated-api-dependencies-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-XXXXXX")"
        resolution_source="$(mktemp -d "${RUNNER_TEMP}/automated-api-resolution-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-XXXXXX")"
        dependency_cache="$(mktemp -d "${RUNNER_TEMP}/automated-api-cache-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-XXXXXX")"
        python_certified_cache="$(mktemp -d "${RUNNER_TEMP}/automated-api-python-certified-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-XXXXXX")"
        dependency_home="$(mktemp -d "${RUNNER_TEMP}/automated-api-home-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-XXXXXX")"
        mkdir -p "${customer_source}" "${certification_source}" "${dependency_source}" "${resolution_source}" "${dependency_cache}" "${python_certified_cache}" "${dependency_home}"
        certification_runtime_uid="$(id -u)"
        certification_runtime_gid="$(id -g)"
        if [ "${certification_runtime_uid}" = 0 ]; then
          certification_runtime_uid=65532
          certification_runtime_gid=65532
        fi
        IFS=$'\x1f' read -r manager_name manager_version manager_variant manager_lockfile manager_spec manager_directory manager_manifest python_version runtime_version scala_version coursier_version erlang_version hex_version hex_archive_url hex_archive_sha512 rebar3_version rebar3_archive_url rebar3_archive_sha512 gradle_prefetch_projects gradle_prefetch_tasks \
          < <(docker run --rm --network none --user "$(id -u):$(id -g)" \
            --mount "type=bind,src=${runner_source},dst=/opt/automated-api,readonly" \
            --mount "type=bind,src=${GITHUB_WORKSPACE},dst=/workspace,readonly" \
            --mount "type=bind,src=${JOB_PATH},dst=/input/job.json,readonly" \
            --mount "type=bind,src=${dependency_source},dst=/opt/dependency-source" \
            --workdir /workspace \
            "${analysis_image}" \
            node /opt/automated-api/packages/runner/dist/dependencyCli.js \
              /input/job.json /workspace /opt/dependency-source)
        test -n "${manager_name}"
        test -n "${manager_version}"
        test -n "${manager_variant}"
        test -n "${manager_lockfile}"
        test -n "${manager_spec}"
        test -n "${manager_directory}"
        test -n "${manager_manifest}"
        python_image="python:3.12.11-slim-bookworm@sha256:519591d6871b7bc437060736b9f7456b8731f1499a57e22e6c285135ae657bf7"
        rust_image="rust:1.96.1-slim-bookworm@sha256:e18a79fc84dfcfc3ab5ba72290398a644c135c97eaa881447fddc354ee4701a3"
        go_image="golang:1.26.5-bookworm@sha256:53eeac89074db483fdf0ab3be1df32bf6e47562263d2d0d6baa7f26acb4957dd"
        java_image="eclipse-temurin:21.0.8_9-jdk-jammy"
        dotnet_image="mcr.microsoft.com/dotnet/sdk:9.0.304"
        php_image="php:8.4.11-cli-bookworm"
        composer_image="composer:2.8.10"
        ruby_image="ruby:3.4.5-bookworm"
        swift_image="swift:6.2.0-jammy"
        dart_image="dart:3.9.0"
        elixir_image="hexpm/elixir:1.19.4-erlang-27.3.4.6-debian-bookworm-20251208-slim"
        clojure_image="clojure:temurin-21-tools-deps-1.12.0.1530-bookworm-slim"
        bundler_version=2.6.9
        rust_version=1.96.1
        manager_runtime_target=node_runtime
        manager_runtime_images=("${analysis_runtime_ref}")
        resolve_runtime_image() {
          local tag="$1"
          retry_network docker pull --platform linux/amd64 "${tag}" > /dev/null
          local digest
          digest="$(docker image inspect --format '{{index .RepoDigests 0}}' "${tag}")"
          case "${digest}" in *@sha256:????????????????????????????????????????????????????????????????) ;; *) return 1;; esac
          printf '%s' "${digest}"
        }
        case "${manager_variant}" in
          python-pip|python-uv|python-stdlib)
            manager_runtime_target=python_runtime
            requested_python_version="${python_version}"
            case "${requested_python_version}" in
              [0-9]*.[0-9]*)
